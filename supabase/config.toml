# Supabase project configuration.
#
# This file describes the project `khqqfgqvwdxlqkncwtmh` so that the Supabase CLI
# can reproduce it locally (`supabase start`, `supabase db reset`). It is the
# companion to `supabase/migrations/`, which is the schema source of truth.
#
# Two settings matter for this application:
#
#   * `api.schemas` exposes only `public` (and `graphql_public`) through the
#     Data API. `sims_private` holds the identity map, the MFA tables and the
#     authorisation helpers; the RLS policies call into it, but it must stay
#     invisible to the browser. See migration 017.
#   * `api.extra_search_path` includes `extensions`, because `pgcrypto` is
#     installed there and the live functions call `extensions.pgp_sym_encrypt`,
#     `extensions.hmac` and `extensions.crypt`.

project_id = "khqqfgqvwdxlqkncwtmh"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
schema_paths = ["./supabase/migrations"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

# The one bucket the application uses. It is private: every download goes
# through a signed URL that the database authorises first.
[storage.buckets.sims-documents]
enabled = true
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Multi-factor authentication. The database decides *who* must enrol through
# `sims_private.mfa_required_role`; the platform only has to be able to
# challenge a user once they have a factor.
[auth.mfa]
enabled = true
max_enrolled_factors = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

[auth.email.template.subject.reset_password]
subject = "Reset your SIMS password"

[auth.email.template.subject.confirmation]
subject = "Confirm your SIMS account"

[auth.email.template.subject.change_email]
subject = "Confirm your new email address"

[auth.email.template.subject.magic_link]
subject = "Your SIMS sign-in link"

[auth.email.template.subject.invite]
subject = "You have been invited to SIMS"
